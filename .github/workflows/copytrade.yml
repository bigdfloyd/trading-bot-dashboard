name: Imaginary FOMO copy trading (live)

# NO trades, not even paper money. Listens live to 6 FOMO traders' Solana wallets and copies each swap
# with imaginary $100s within seconds of it confirming. One run listens for ~5h40m; the next run is already
# queued (concurrency) so they follow each other back to back. A backup sweep every 5 min catches anything missed.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: fomo-copytrade
  cancel-in-progress: false

permissions:
  contents: write   # publishes copy_state.json next to fomo.html so the page updates live

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Get the bot repo
        env:
          KEY: ${{ secrets.PRIVATE_REPO_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone -q --depth 1 git@github.com:bigdfloyd/trading-bot-paper.git bot

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Copy live
        env:
          TZ: UTC
          PYTHONUNBUFFERED: "1"
          COPY_PUBLISH: bash ../publish_copy.sh
        run: |
          pip install -q websockets
          git config --global user.name "fomo-copytrade"
          git config --global user.email "trading-bot@users.noreply.github.com"
          cat > publish_copy.sh <<'SH'
          # runs inside bot/ after every copied swap and every backup sweep
          git add copy_state.json && { git diff --cached --quiet || git commit -q -m "Copy $(date -u '+%Y-%m-%d %H:%M:%S UTC')"; }
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 3; done
          cp copy_state.json ../copy_state.json
          cd .. && git add copy_state.json && { git diff --cached --quiet || git commit -q -m "Copy $(date -u '+%H:%M:%S UTC')"; }
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 3; done
          true
          SH
          cd bot && python copytrade.py --watch 335
